name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main
      - bold-effects

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install and Build 🔧
        run: |
          cd portfolio-next
          npm ci
          npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: portfolio-next/out
          branch: gh-pages
